name: Security and Supply Chain

on:
  push:
    branches: ["master", "main"]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_django.txt
          pip install pip-audit cyclonedx-bom bandit

      - name: Python vulnerability audit
        run: pip-audit -r requirements_django.txt

      - name: Python SAST (bandit)
        run: bandit -r api rag_project -x api/tests.py

      - name: Generate Python SBOM
        run: cyclonedx-py requirements requirements_django.txt -o backend-sbom.json

      - name: Upload backend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend-sbom.json

  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: NPM audit
        run: npm audit --audit-level=high

      - name: Generate frontend SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file frontend-sbom.json

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@v4
        with:
          name: frontend-sbom
          path: Frontend/frontend-sbom.json
