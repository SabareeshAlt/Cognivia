version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: academerag
      POSTGRES_USER: academerag
      POSTGRES_PASSWORD: academerag
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
