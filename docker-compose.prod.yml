version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn rag_project.asgi:application --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    cap_drop:
      - ALL

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    cap_drop:
      - ALL

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    cap_drop:
      - ALL

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: academerag
      POSTGRES_USER: academerag
      POSTGRES_PASSWORD: academerag
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
